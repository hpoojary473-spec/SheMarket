<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Orders | SheMarket</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="/assets/js/api.js"></script>
  <script defer src="/assets/js/admin.js"></script>
</head>
<body data-page="admin-orders">
  <header class="topbar">
    <a class="brand" href="/index.html"><span class="brand-mark">S</span>SheMarket</a>
    <nav class="nav-links">
      <a href="/index.html">Marketplace</a>
      <button data-logout type="button">Logout</button>
    </nav>
  </header>
  <div class="app-layout">
    <aside class="sidebar">
      <nav>
        <a href="/pages/shg-dashboard.html"><i data-lucide="users"></i> SHG Dashboard</a>

        <a href="/pages/admin-orders.html"><i data-lucide="list-ordered"></i> All Orders</a>
        <a href="/pages/reports.html"><i data-lucide="file-bar-chart"></i> Reports</a>

      <div class="page-title">
        <div>
          <h1>All Orders</h1>

        </div>

      <section class="panel table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Buyer</th>
              <th>Seller</th>
              <th>Qty</th>
              <th>Total</th>

              <th>Update</th>

          <tbody id="admin-orders-body"><tr><td colspan="7">Loading orders...</td></tr></tbody>
